name: siteskin-lint (deployed origin)

# Runs the real validator against the live site, over the network, exactly as a site owner would:
#
#     ./gradlew :siteskin-lint:run --args="https://denrzv.github.io"
#
# Exit 0 means a trusted configuration exists — warnings and dropped items do not change that.
#
# What this catches that the offline checks in manifest-guard.yml cannot: TLS, the redirect chain,
# the response Content-Type, and whether the deployed bytes are the bytes in this repository.
#
# Manual, for one remaining reason: this job checks out denrzv/webora for the validator, and that
# repository is private, so the checkout fails without a token. Making it public — or adding a PAT
# secret — is what turns this into something that can run on a schedule. Until then the check is run
# locally against the live origin; it passes.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin to lint (scheme and host only, no path)
        required: true
        default: https://denrzv.github.io

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validator
        uses: actions/checkout@v4
        with:
          repository: denrzv/webora
          path: webora

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Lint the deployed manifest
        working-directory: webora
        run: ./gradlew --quiet :siteskin-lint:run --args="${{ inputs.origin }}"
