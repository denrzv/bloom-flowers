name: Deploy site

# Publishes the repository root to GitHub Pages, which serves it at the custom domain pinned in
# CNAME.
#
# The custom domain is a functional requirement, not branding. SiteSkin discovery requests
# `/.well-known/siteskin.json` at the ORIGIN ROOT. On a project-pages URL such as
# denrzv.github.io/bloom-flowers/ that path belongs to whatever is deployed at the user-site root —
# a different repository, and in the general case a different site owner — so no SiteSkin browser
# would ever request this manifest. The manifest's own paths compound it: "/catalog" would resolve
# to denrzv.github.io/catalog, outside this deployment entirely.
#
# The whole repository is uploaded, including .well-known/, tools/ and the markdown. Publishing the
# guide and the generator beside the site is deliberate: the reference integration is meant to be
# read, and a visitor who wants to see what the browser fetches should be able to fetch it too.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy may wait; an in-flight one is never cancelled, so a half-published site cannot
# become the live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Every path the manifest names is served
        run: python3 tools/check-routes.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
